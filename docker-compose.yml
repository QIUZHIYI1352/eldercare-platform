# 智慧实训规范平台 — Linux 一键部署（MySQL 版）
#
# 首次使用：在项目目录创建 .env 文件（复制下方两行）：
#   MYSQL_ROOT_PASSWORD=改成你自己的强密码
#
# 启动：
#   docker compose up -d --build
#   → 访问 http://服务器IP:8000

services:
  mysql:
    image: mysql:8.0
    container_name: eldercare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eldercare_root}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: eldercare-platform:latest
    container_name: eldercare-web
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models    # pose 模型（首次启动自动下载）
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eldercare_root}
      MYSQL_DB: eldercare
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 实时监控识别（默认不启动：docker compose --profile monitor up -d）
  # 服务器无本地摄像头，生产环境请把 MONITOR_SOURCE 指向 RTSP 网络摄像头
  monitor:
    build: .
    image: eldercare-platform:latest
    container_name: eldercare-monitor
    profiles: ["monitor"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eldercare_root}
      MYSQL_DB: eldercare
      MONITOR_SOURCE: "rtsp://user:password@摄像头IP:554/stream1"
      MONITOR_PROCESS: "协助卧床老人翻身"
      MONITOR_SAVE: "true"
    restart: unless-stopped
    command: ["/bin/sh", "/app/scripts/monitor-entrypoint.sh"]

volumes:
  mysql_data:
